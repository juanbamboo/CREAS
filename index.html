<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero CREAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEDE6; --surface:#F6F5EF; --ink:#2B2A23; --olive:#5F6B45;
  --clay:#A9552F; --muted:#8A8778; --border:#D9D8CC; --olive-soft:#E7E9DB;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Inter,system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:28px 20px 80px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.brand{font-family:Fraunces,serif;font-weight:900;font-size:34px;letter-spacing:-.02em;line-height:1}
.brand small{display:block;font-family:Inter;font-weight:500;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-top:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px;
  padding:11px 18px;border-radius:10px}
.btn-primary{background:var(--olive);color:#fff}
.btn-primary:hover{background:#525c3b}
.btn-ghost{background:transparent;color:var(--olive);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--olive)}
.updated{font-size:12px;color:var(--muted);margin:2px 0 22px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:20px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:2px;background:var(--border);
  border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px}
.det{background:var(--surface);padding:16px 18px}
.det dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.det dd{margin:0;font-size:15px;font-weight:500}
.det.phase{background:var(--olive-soft)}
.block-item{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-top:1px solid var(--border)}
.block-item:first-of-type{border-top:none}
.dot{flex:0 0 9px;width:9px;height:9px;border-radius:50%;background:var(--clay);margin-top:7px}
.block-body{flex:1}
.block-title{font-weight:600}
.block-meta{font-size:13px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;
  background:#F1D9CE;color:var(--clay);margin-left:8px;vertical-align:middle}
.empty{color:var(--muted);font-style:italic;padding:6px 0}
.next-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.next{border-left:3px solid var(--olive);padding:2px 0 2px 14px}
.next .cat{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--olive)}
.next .task{font-size:14px;font-weight:500;margin-top:3px}
.next .meta{font-size:12px;color:var(--muted);margin-top:2px}
.cat-block{margin-bottom:6px}
.cat-name{font-family:Fraunces,serif;font-weight:600;font-size:17px;margin:18px 0 4px}
.cat-block:first-child .cat-name{margin-top:0}
.line{position:relative;padding-left:22px}
.line::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border)}
.task-row{position:relative;padding:9px 0;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.task-row::before{content:"";position:absolute;left:-21px;top:14px;width:11px;height:11px;border-radius:50%;
  background:var(--surface);border:2px solid var(--muted)}
.task-row.done::before{background:var(--olive);border-color:var(--olive)}
.task-row.late::before{background:var(--clay);border-color:var(--clay)}
.t-main{flex:1}
.t-name{font-size:14px;font-weight:500}
.task-row.done .t-name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border)}
.t-resp{font-size:12px;color:var(--muted);margin-top:1px}
.t-date{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.status{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.status.done{background:var(--olive-soft);color:var(--olive)}
.status.pend{background:#EDEBE1;color:var(--muted)}
.status.late{background:#F1D9CE;color:var(--clay)}
.eco table{width:100%;border-collapse:collapse;font-size:14px}
.eco th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding:0 0 8px;border-bottom:1px solid var(--border)}
.eco td{padding:10px 0;border-bottom:1px solid var(--border)}
.eco td.num{text-align:right;font-variant-numeric:tabular-nums}
.eco tfoot td{font-weight:700;border-bottom:none;padding-top:14px}
.chip{font-size:12px;padding:2px 9px;border-radius:20px;background:var(--olive-soft);color:var(--olive)}
@media(max-width:560px){.brand{font-size:28px}.t-date{display:none}}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">CREAS<small>Tablero del proyecto · Fase 1</small></div>
    <div class="actions">
      <a class="btn btn-ghost" id="editBtn" href="#" target="_blank" rel="noopener" style="display:none">✏️ Editar datos</a>
      <a class="btn btn-primary" id="driveBtn" href="#" target="_blank" rel="noopener">📁 Abrir Drive</a>
    </div>
  </div>
  <div class="updated" id="updated"></div>

  <dl class="details" id="details"></dl>

  <section class="card">
    <p class="eyebrow">Bloqueos urgentes</p>
    <div id="blockers"></div>
  </section>

  <section class="card">
    <p class="eyebrow">Próximo paso por categoría</p>
    <div class="next-grid" id="nextSteps"></div>
  </section>

  <section class="card">
    <p class="eyebrow">Cronograma por categoría</p>
    <div id="timeline"></div>
  </section>

  <section class="card eco">
    <p class="eyebrow">Económico · gastos realizados</p>
    <table>
      <thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría / C. de costo</th><th style="text-align:right">Monto</th></tr></thead>
      <tbody id="expBody"></tbody>
      <tfoot><tr><td colspan="3">Total gastado</td><td class="num" id="expTotal"></td></tr></tfoot>
    </table>
  </section>

</div>

<script>
/* ====================================================================
   EDITÁ SOLO ESTE BLOQUE Y VOLVÉ A PUBLICAR (push al repo). Nada más.
   - Es una página estática: no guarda cambios desde el navegador y no
     necesita base de datos. Todo lo que ves (vencidos, próximos pasos,
     totales) lo calcula sola desde estos datos.
   - Clave de acceso / edición en vivo / avisos automáticos NO van acá:
     eso necesita backend. (Los recordatorios de reunión los da Google
     Calendar sumando a Ariel y Guille como invitados.)
   - estado de tarea: "cumplido" o "pendiente".
   - una tarea "pendiente" con fecha ya pasada salta sola a Bloqueos.
   - fecha en formato "AAAA-MM-DD".
   ==================================================================== */
const DATA = {
  driveUrl: "https://drive.google.com/drive/folders/13Pn51k22zebdLQpIIEeX8KeY0OKmvHpR",
  editUrl: "",   // pegá el link de edición del archivo en GitHub para que aparezca "Editar datos"
  moneda: "USD",

  detalles: {
    "Objetivo": "Loteo residencial · 25 parcelas (~5.000 m²). Centro CREAS en Fase 2.",
    "Ubicación": "San Javier – Achiras Arriba, Córdoba (+950 msnm)",
    "Terreno": "~15 ha (≈12,5 ha vendibles + Centro + caminos)",
    "Forma de propiedad": "Derecho posesorio (a estructurar con Fernando)",
    "Inversión estimada": "A definir en Fase 1",
    "Fase actual": "Fase 1 – Preproyecto · cierre 30/09/2026"
  },

  bloqueos: [
    { titulo:"Enviar propuesta a Ariel para firma electrónica", quien:"Juani", para:"Esta semana" },
    { titulo:"Encargar a Fernando: crear CREAS SAS + estructurar figura de la tierra", quien:"Juani → Fernando", para:"Esta semana" }
  ],

  tareas: [
    { cat:"Legal / Sociedad", nombre:"Enviar propuesta a Ariel para firma electrónica (2 h)", resp:"Juani", fecha:"2026-07-08", estado:"pendiente" },
    { cat:"Legal / Sociedad", nombre:"Encargo a Fernando (SAS + figura tierra)", resp:"Juani", fecha:"2026-07-08", estado:"pendiente" },
    { cat:"Legal / Sociedad", nombre:"Constitución CREAS SAS", resp:"Fernando", fecha:"2026-08-15", estado:"pendiente" },
    { cat:"Legal / Sociedad", nombre:"Dictamen figura de tierra (derecho posesorio)", resp:"Fernando", fecha:"2026-08-15", estado:"pendiente" },

    { cat:"Alcance", nombre:"Documento de alcance v1 (barrio primero vs todo junto)", resp:"Juani", fecha:"2026-08-02", estado:"pendiente" },

    { cat:"Municipal", nombre:"Confirmar zona roja del loteo (agrimensor)", resp:"Agrimensor", fecha:"2026-08-23", estado:"pendiente" },

    { cat:"Económico", nombre:"Planilla: presupuesto + P&L + proyección", resp:"Juani", fecha:"2026-08-09", estado:"pendiente" },
    { cat:"Económico", nombre:"Cotizaciones de costos (equipo extendido)", resp:"Juani", fecha:"2026-08-30", estado:"pendiente" },

    { cat:"Equipo", nombre:"Equipo extendido con nombre y contacto", resp:"Juani", fecha:"2026-07-26", estado:"pendiente" },
    { cat:"Riesgos", nombre:"Matriz de riesgos + plan de acción", resp:"Juani", fecha:"2026-07-26", estado:"pendiente" },
    { cat:"Servicios", nombre:"Plan de servicios (caminos, agua, luz, internet) v1", resp:"Juani", fecha:"2026-09-06", estado:"pendiente" },

    { cat:"Gobernanza", nombre:"Reunión R2 (avance)", resp:"Equipo base", fecha:"2026-07-22", estado:"pendiente" },
    { cat:"Gobernanza", nombre:"Reunión R3 (avance)", resp:"Equipo base", fecha:"2026-08-12", estado:"pendiente" },
    { cat:"Gobernanza", nombre:"Reunión R4 (avance)", resp:"Equipo base", fecha:"2026-09-02", estado:"pendiente" },
    { cat:"Gobernanza", nombre:"Reunión Go/No-Go (cierre Fase 1)", resp:"Equipo base", fecha:"2026-09-23", estado:"pendiente" }
  ],

  // Agregá filas: { fecha, concepto, categoria, monto }
  gastos: [
    // { fecha:"2026-07-20", concepto:"Honorarios constitución SAS", categoria:"Legal / Sociedad", monto:400 }
  ]
};

/* ---------- render (no tocar) ---------- */
const $=id=>document.getElementById(id);
const today=new Date(); today.setHours(0,0,0,0);
const fmt=iso=>{const[a,m,d]=iso.split("-");return d+"/"+m};
const money=n=>DATA.moneda+" "+n.toLocaleString("es-AR");

$("driveBtn").href=DATA.driveUrl;
if(DATA.editUrl){ const e=$("editBtn"); e.href=DATA.editUrl; e.style.display=""; }
$("updated").textContent="Actualizado "+today.toLocaleDateString("es-AR",{day:"numeric",month:"long",year:"numeric"});

$("details").innerHTML=Object.entries(DATA.detalles).map(([k,v])=>{
  const ph=k==="Fase actual"?" phase":"";
  return `<div class="det${ph}"><dt>${k}</dt><dd>${v}</dd></div>`;
}).join("");

DATA.tareas.forEach(t=>{ t._late = t.estado!=="cumplido" && new Date(t.fecha+"T00:00:00")<today; });

let bl="";
DATA.bloqueos.forEach(b=>{
  bl+=`<div class="block-item"><span class="dot"></span><div class="block-body">
    <div class="block-title">${b.titulo}</div>
    <div class="block-meta">${b.quien} · para ${b.para}</div></div></div>`;
});
DATA.tareas.filter(t=>t._late).forEach(t=>{
  bl+=`<div class="block-item"><span class="dot"></span><div class="block-body">
    <div class="block-title">${t.nombre}<span class="tag">vencido ${fmt(t.fecha)}</span></div>
    <div class="block-meta">${t.resp} · ${t.cat}</div></div></div>`;
});
$("blockers").innerHTML=bl||'<p class="empty">Sin bloqueos. Todo en fecha.</p>';

const nextByCat={};
DATA.tareas.forEach(t=>{
  if(t.estado==="cumplido") return;
  if(!nextByCat[t.cat] || t.fecha<nextByCat[t.cat].fecha) nextByCat[t.cat]=t;
});
$("nextSteps").innerHTML=Object.values(nextByCat).map(t=>
  `<div class="next"><div class="cat">${t.cat}</div>
   <div class="task">${t.nombre}</div>
   <div class="meta">${t.resp} · ${fmt(t.fecha)}${t._late?' · <span style="color:var(--clay)">vencido</span>':''}</div></div>`
).join("") || '<p class="empty">Todo cumplido.</p>';

const cats=[...new Set(DATA.tareas.map(t=>t.cat))];
$("timeline").innerHTML=cats.map(c=>{
  const items=DATA.tareas.filter(t=>t.cat===c).map(t=>{
    const cls=t.estado==="cumplido"?"done":t._late?"late":"";
    const st=t.estado==="cumplido"?'<span class="status done">Cumplido</span>':
             t._late?'<span class="status late">Vencido</span>':'<span class="status pend">Pendiente</span>';
    return `<div class="task-row ${cls}"><div class="t-main">
      <div class="t-name">${t.nombre}</div><div class="t-resp">${t.resp}</div></div>
      <span class="t-date">${fmt(t.fecha)}</span>${st}</div>`;
  }).join("");
  return `<div class="cat-block"><div class="cat-name">${c}</div><div class="line">${items}</div></div>`;
}).join("");

if(DATA.gastos.length){
  $("expBody").innerHTML=DATA.gastos.map(g=>
    `<tr><td>${fmt(g.fecha)}</td><td>${g.concepto}</td><td><span class="chip">${g.categoria||"—"}</span></td><td class="num">${money(g.monto)}</td></tr>`).join("");
  $("expTotal").textContent=money(DATA.gastos.reduce((s,g)=>s+g.monto,0));
}else{
  $("expBody").innerHTML='<tr><td colspan="4" class="empty">Sin gastos registrados aún.</td></tr>';
  $("expTotal").textContent=money(0);
}
</script>
</body>
</html>
